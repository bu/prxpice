# Meson cross-compilation file for iOS arm64
# Used by glib, json-glib, pixman, and spice-client-glib builds

[binaries]
c = '/usr/bin/xcrun --sdk iphoneos clang'
cpp = '/usr/bin/xcrun --sdk iphoneos clang++'
ar = '/usr/bin/xcrun --sdk iphoneos ar'
strip = '/usr/bin/xcrun --sdk iphoneos strip'
pkgconfig = '/usr/local/bin/pkg-config'

[built-in options]
c_args = ['-arch', 'arm64', '-miphoneos-version-min=15.0', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk', '-fembed-bitcode']
c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=15.0', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk']

[properties]
sys_root = '/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk'
has_function_printf = true
has_function_hfkerhisadf = false

[host_machine]
system = 'darwin'
subsystem = 'ios'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'
